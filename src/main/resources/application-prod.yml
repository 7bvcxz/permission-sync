# PROD 환경 - 운영 서버용 DB
# 실행: --spring.profiles.active=prod

spring:
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/permissionsdb_prod
    username: prod_user
    password: prod_secret
    driver-class-name: org.postgresql.Driver

# 외부 User API 서버 주소 (PROD)
user-api:
  base-url: https://api.prod-server.com
