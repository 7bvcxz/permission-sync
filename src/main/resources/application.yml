# 공통 설정 파일 - 모든 환경에서 공유되는 설정을 여기에 작성
# DB 접속 정보는 각 profile 파일(application-dev/qa/prod.yml)에서 관리
# 실행 시 profile 지정: --spring.profiles.active=dev (또는 qa, prod)

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
