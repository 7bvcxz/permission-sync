# 공통 설정 파일 - 모든 환경에서 공유되는 설정
# DB 접속 정보 및 외부 API URL 은 각 환경별 파일에서 설정
#   application-local.yml  (로컬 개발)
#   application-dev.yml    (개발 서버)
#   application-qa.yml     (QA 서버)
#   application-prod.yml   (운영 서버)
#
# 처음 사용하는 경우 application-example.yml 을 참고해 위 파일을 만들어주세요.
# 실행 방법: --spring.profiles.active=local (또는 dev / qa / prod)

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
