# 공통 설정 파일 - 모든 환경에서 공유되는 설정
# 민감한 값(DB 비밀번호 등)은 ENC(...) 형식의 암호화 문자열로 각 profile 파일에 저장
# 복호화 키는 환경변수 APP_SECRET_KEY 로 주입 (코드/Repository에 포함 금지)
#
# 실행 방법: --spring.profiles.active=dev (또는 local / qa / prod)
# 환경변수 설정 예시: export APP_SECRET_KEY=your-secret-key

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Jasypt 복호화 키를 환경변수 APP_SECRET_KEY 에서 읽음
jasypt:
  encryptor:
    password: ${APP_SECRET_KEY}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
