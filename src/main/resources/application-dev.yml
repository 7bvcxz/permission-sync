# DEV 환경 - 개발자 로컬 또는 개발 서버용 DB
# 실행: --spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/permissionsdb_dev
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

# 외부 User API 서버 주소 (DEV)
user-api:
  base-url: http://localhost:8081
